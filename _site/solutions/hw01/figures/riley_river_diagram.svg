<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 700" width="1380" height="700" font-family="'Source Sans Pro','Lato','Helvetica Neue',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrBrown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a87c50"></path>
    </marker>
    <marker id="arrBlack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111111"></path>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b3990"></path>
    </marker>
  </defs>

  <rect width="1380" height="700" fill="#ffffff"></rect>

  <g stroke="#2b3990" stroke-width="11" stroke-linecap="butt">
    <line x1="300" y1="330" x2="380" y2="330"></line>
    <line x1="480" y1="330" x2="720" y2="330"></line>
    <line x1="820" y1="330" x2="1180" y2="330"></line>
    <line x1="1280" y1="330" x2="1340" y2="330"></line>
    <line x1="300" y1="560" x2="1340" y2="560"></line>
  </g>

  <g stroke="#a87c50" stroke-width="4" fill="none">
    <line x1="380" y1="150" x2="380" y2="340"></line>
    <line x1="480" y1="150" x2="480" y2="340"></line>
    <line x1="720" y1="150" x2="720" y2="340"></line>
    <line x1="820" y1="150" x2="820" y2="340"></line>
    <line x1="1180" y1="150" x2="1180" y2="340"></line>
    <line x1="1280" y1="150" x2="1280" y2="340"></line>
    <line x1="430" y1="170" x2="430" y2="292" marker-end="url(#arrBrown)"></line>
    <line x1="770" y1="170" x2="770" y2="292" marker-end="url(#arrBrown)"></line>
    <line x1="1230" y1="170" x2="1230" y2="292" marker-end="url(#arrBrown)"></line>
  </g>

  <g fill="#a87c50" text-anchor="middle">
    <text x="430" y="44" font-size="34">Factory 1</text>
    <text x="770" y="44" font-size="34">Factory 2</text>
    <text x="1230" y="44" font-size="34">Factory 3</text>
    <text x="430" y="86" font-size="26">Q₁ = 100,000 m³/d</text>
    <text x="770" y="86" font-size="26">Q₂ = 60,000 m³/d</text>
    <text x="1230" y="86" font-size="26">Q₃ = 200,000 m³/d</text>
    <text x="430" y="120" font-size="26">C₁ = 10 mg/L</text>
    <text x="770" y="120" font-size="26">C₂ = 20 mg/L</text>
    <text x="1230" y="120" font-size="26">C₃ = 8 mg/L</text>
  </g>

  <g stroke="#111111" stroke-width="3">
    <line x1="480" y1="250" x2="720" y2="250"></line>
    <line x1="480" y1="238" x2="480" y2="262"></line>
    <line x1="720" y1="238" x2="720" y2="262"></line>
    <line x1="820" y1="250" x2="1180" y2="250"></line>
    <line x1="820" y1="238" x2="820" y2="262"></line>
    <line x1="1180" y1="238" x2="1180" y2="262"></line>
  </g>
  <g fill="#111111" text-anchor="middle" font-size="28">
    <text x="600" y="224">10 km</text>
    <text x="1000" y="224">15 km</text>
  </g>

  <g fill="#111111" text-anchor="middle">
    <text x="174" y="400" font-size="30">River inflow</text>
    <text x="174" y="432" font-size="26">Q₀ = 500,000 m³/d</text>
    <text x="174" y="512" font-size="26">C₀ = 0.2 mg/L</text>
  </g>
  <line x1="60" y1="470" x2="288" y2="470" stroke="#111111" stroke-width="4" marker-end="url(#arrBlack)"></line>

  <text x="430" y="372" font-size="26" fill="#111111" text-anchor="middle">x = 0</text>

  <text x="935" y="415" font-size="24" fill="#111111" text-anchor="middle">CRUD decays, first order, rate k</text>
  <text x="935" y="472" font-size="28" fill="#2b3990" text-anchor="middle">v = 25 km/d</text>
  <line x1="775" y1="505" x2="1095" y2="505" stroke="#2b3990" stroke-width="4" marker-end="url(#arrBlue)"></line>
</svg>